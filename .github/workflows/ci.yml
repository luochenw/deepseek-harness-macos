name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contract:
    name: Typecheck + unit + build + smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck all production sources + UI contract checks
        run: ./scripts/test-macos-native.sh
      - name: Unit tests (macos/DSHTests)
        run: ./scripts/test-macos-native.sh --unit
      - name: Prepare pinned latest DSH runtime
        run: echo "DSH_SOURCE=$(DSH_RUNTIME_VERIFY_LATEST=1 ./scripts/prepare-dsh-runtime.sh)" >> "$GITHUB_ENV"
      - name: Agent Platform runtime contracts
        run: ./scripts/test-agent-platform-runtime-script.sh && ./scripts/test-agent-platform-runtime.sh
      - name: Build DeepSeek Harness.app
        run: ./scripts/build-macos-app.sh
      - name: Smoke test the packaged Host (read + write RPC paths)
        run: ./scripts/test-macos-native.sh --smoke
